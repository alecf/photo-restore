[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "photo-restore"
version = "0.1.0"
description = "Local CLI to restore scans of old family photos — faithful upscaling, face restoration, and contrast, no colorization."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alec Flett" }]
keywords = ["photo", "restoration", "upscale", "gfpgan", "real-esrgan", "apple-silicon"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Environment :: GPU",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

# Core deps are intentionally light so the CLI, resolution math, and tests run
# without the multi-gigabyte ML stack. The models live in the `ml` extra.
dependencies = [
    "pillow>=10.4",
    "numpy>=1.26",
    "typer>=0.12",
]

[project.optional-dependencies]
# Everything needed to actually run the restoration models. We deliberately do
# NOT depend on the `gfpgan`/`realesrgan` packages: both drag in `basicsr`, which
# fails to build on modern Python (3.12+). Instead spandrel runs every network
# (the upscaler and the face-restoration nets alike) and facexlib handles face
# detection / alignment / paste-back — the same pieces gfpgan uses internally,
# minus the unbuildable dependency.
ml = [
    "torch>=2.2",
    "torchvision>=0.17",
    "spandrel>=0.4",
    "facexlib>=0.3",
    "opencv-python>=4.9",
]
# CodeFormer (`--strength balanced`) lives in spandrel_extra_arches, which is
# kept separate because CodeFormer ships under a non-commercial license. The
# permissively licensed conservative default does not need this.
balanced = [
    "spandrel-extra-arches>=0.2",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
restore-photos = "photo_restore.cli:app"

[project.urls]
Homepage = "https://github.com/alecf/photo-restore"
Repository = "https://github.com/alecf/photo-restore"

[tool.hatch.build.targets.wheel]
packages = ["src/photo_restore"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
# The ml extra ships its own (often untyped) stubs; don't fail on them.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
